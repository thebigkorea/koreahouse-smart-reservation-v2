<script>

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

function escapeAttr(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");

}

function formatMoney(value){

    return Number(value || 0).toLocaleString();

}

</script>
