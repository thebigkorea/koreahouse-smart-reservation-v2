 <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"Noto Sans KR",Arial,sans-serif;
      background:#f4f0e8;
      color:#18252d;
    }
    .app{display:flex;min-height:100vh}
    .sidebar{
      width:270px;
      background:linear-gradient(180deg,#101d24,#1b3039);
      color:#fff;
      padding:26px 20px;
      position:fixed;
      left:0;top:0;bottom:0;
    }
    .brand{
      padding:10px 10px 24px;
      border-bottom:1px solid rgba(255,255,255,.14);
      margin-bottom:20px;
    }
    .brand-title{font-size:30px;font-weight:900}
    .brand-sub{margin-top:7px;font-size:13px;color:#d8bd74;font-weight:800}
    .menu{display:flex;flex-direction:column;gap:8px}
    .menu button{
      border:0;background:transparent;color:#dce5e8;text-align:left;
      padding:15px 16px;border-radius:16px;font-size:16px;
      cursor:pointer;font-weight:900;
    }
    .menu button.active,.menu button:hover{
      background:rgba(216,189,116,.18);color:#fff;
    }
    .main{margin-left:270px;flex:1;padding:30px}
    .hero{
      background:linear-gradient(135deg,rgba(13,28,36,.97),rgba(32,52,60,.94));
      border-radius:30px;padding:30px;color:#fff;margin-bottom:24px;
      box-shadow:0 18px 44px rgba(0,0,0,.14);
    }
    .hero-row{display:flex;justify-content:space-between;gap:24px;align-items:center}
    .hero h1{margin:0;font-size:34px;font-weight:900}
    .hero p{margin:10px 0 0;color:#d8e2e5;font-size:15px;font-weight:700}
    .today-pill{
      display:inline-block;margin-top:15px;padding:9px 14px;border-radius:999px;
      background:rgba(255,255,255,.12);color:#f2d98f;font-size:14px;font-weight:900;
    }
    .btn{
      border:0;padding:14px 19px;border-radius:16px;font-weight:900;
      cursor:pointer;font-size:15px;white-space:nowrap;
    }
    .btn-gold{background:#d8bd74;color:#111}
    .btn-light{background:#f0ebe1;color:#263238}
    .btn-green{background:#dcefd3;color:#2e7d32}
    .btn-yellow{background:#fff1c6;color:#8a5a00}
    .cards{
      display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:22px;
    }
    .card,.panel{
      background:#fffdf8;border-radius:25px;padding:24px;
      box-shadow:0 10px 30px rgba(0,0,0,.07);
      border:1px solid rgba(216,189,116,.22);
    }
    .card-label{font-size:14px;color:#667981;font-weight:900}
    .card-num{margin-top:11px;font-size:36px;font-weight:900}
    .card-note{margin-top:8px;font-size:12px;color:#8a7a56;font-weight:800}
    .grid{display:grid;grid-template-columns:1.35fr .75fr;gap:20px;margin-bottom:20px}
    .panel{border-radius:27px;margin-bottom:20px}
    .panel-title{
      display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;
    }
    .panel-title h2{margin:0;font-size:23px;font-weight:900}
    .timeline,.todo{display:flex;flex-direction:column;gap:13px}
    .reservation-card{
      border:1px solid #eee0c8;background:#fffaf0;border-radius:22px;padding:18px;
    }
    .reservation-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}
    .reservation-time{font-size:22px;font-weight:900}
    .reservation-name{font-size:19px;font-weight:900;margin-bottom:8px}
    .reservation-info{color:#60747d;font-size:14px;line-height:1.7;font-weight:800}
    .reservation-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
    .reservation-actions button{padding:9px 11px;border-radius:12px;font-size:13px}
    .badge{
      display:inline-block;padding:8px 13px;border-radius:999px;
      font-size:12px;font-weight:900;text-align:center;
    }
    .ok{background:#dcefd3;color:#2e7d32}
    .wait{background:#fff1c6;color:#8a5a00}
    .gray{background:#eceff1;color:#455a64}
    .vip{background:#241f17;color:#f1d891}
    .todo-item{
      background:#f8f2e6;padding:17px;border-radius:19px;border:1px solid #eee0c8;
    }
    .todo-row{display:flex;justify-content:space-between;align-items:center;font-weight:900}
    .todo-row span:last-child{font-size:22px}
    .todo-actions{margin-top:12px;display:flex;gap:8px}
    .todo-actions button{flex:1;padding:10px;font-size:13px;border-radius:12px}
    .seat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
    .seat-card{
      background:#f8f2e6;border-radius:20px;padding:18px;border:1px solid #eee0c8;
    }
    .seat-card h3{margin:0 0 13px;font-size:19px;font-weight:900}
    .seat-row{
      display:flex;justify-content:space-between;gap:10px;padding:8px 0;
      border-top:1px dashed #ddcfb5;font-size:13px;font-weight:900;
    }

    .seat-btn.reserved{
       background:#ef4444 !important;
       color:#fff !important;
       border-color:#dc2626 !important;
       cursor:not-allowed !important;
     }
     .seat-btn.reserved small{
       color:#fff !important;
     }
    .seat-row b.free{color:#2e7d32}
    .seat-row b.busy{color:#8a5a00}
    .search-box{display:flex;gap:12px;margin-bottom:18px}
    .search-wrap{position:relative;flex:1}
    .search-wrap span{
      position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#78909c;
    }
    .search-wrap input{
      width:100%;padding:16px 16px 16px 44px;border:1px solid #ded2bd;
      border-radius:17px;font-size:16px;background:#fffaf0;
    }
    .list-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
    .message-preview{
      background:#f8f2e6;border:1px solid #eee0c8;border-radius:20px;
      padding:18px;line-height:1.8;font-size:14px;font-weight:800;color:#465a62;
    }
    .modal-bg{
      display:none;position:fixed;inset:0;background:rgba(0,0,0,.48);
      z-index:99;align-items:center;justify-content:center;padding:20px;
    }
    .modal{
      width:100%;max-width:880px;background:#fffdf8;border-radius:30px;
      padding:28px;box-shadow:0 24px 70px rgba(0,0,0,.28);
      max-height:92vh;overflow:auto;
    }
    .modal-head{
      display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;
    }
    .modal-head h2{margin:0;font-size:28px;font-weight:900}
    .close-btn{
      width:42px;height:42px;border:0;border-radius:50%;background:#efe6d5;
      font-size:22px;cursor:pointer;
    }
    .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
    label{display:block;font-size:13px;font-weight:900;color:#455a64;margin-bottom:7px}
    input,select,textarea{
      width:100%;border:1px solid #ded2bd;border-radius:16px;
      padding:15px;font-size:16px;background:#fff;
    }
    textarea{min-height:92px;resize:vertical}
    .full{grid-column:1/-1}
    details{
      grid-column:1/-1;background:#f8f2e6;border:1px solid #eee0c8;
      border-radius:20px;padding:16px;
    }
    summary{cursor:pointer;font-weight:900;color:#18252d;margin-bottom:12px}
    .notice{
      display:none;margin-top:15px;padding:14px;border-radius:15px;
      background:#fff3cd;color:#7a5200;font-weight:900;font-size:14px;
    }
    .modal-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:22px}
    @media(max-width:1100px){
      .sidebar{position:relative;width:100%;height:auto}
      .main{margin-left:0}
      .app{display:block}
      .menu{flex-direction:row;overflow-x:auto}
      .cards{grid-template-columns:repeat(2,1fr)}
      .grid{grid-template-columns:1fr}
      .seat-grid{grid-template-columns:repeat(2,1fr)}
    }
    @media(max-width:720px){
      .main{padding:18px}
      .hero-row{display:block}
      .hero button{margin-top:18px}
      .cards{grid-template-columns:1fr}
      .form-grid{grid-template-columns:1fr}
      .list-grid{grid-template-columns:1fr}
      .seat-grid{grid-template-columns:1fr}
    }
    .reservation-table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}

.reservation-table th,
.reservation-table td{
  padding:12px 10px;
  border-bottom:1px solid #eee0c8;
  text-align:center;
  white-space:nowrap;
}

.reservation-table th{
  background:#f8f2e6;
  color:#455a64;
  font-weight:900;
}

.reservation-table td.left{
  text-align:left;
}

.table-actions{
  display:flex;
  gap:6px;
  justify-content:center;
  flex-wrap:wrap;
  min-width:260px;
}

.btn-cancel{
  background:#ffd6d6;
  color:#8a1f1f;
}

.table-actions button{
  padding:7px 9px;
  border-radius:10px;
  font-size:12px;
}


    /* 좌석 배치도 */
    .seat-layout-panel{
      grid-column:1/-1;
      background:#fffdf8;
      border:1px solid #eee0c8;
      border-radius:20px;
      padding:16px;
      margin-top:4px;
    }
    .seat-layout-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom:12px;
      font-weight:900;
      color:#18252d;
    }
    .seat-selected-box{
      background:#f8f2e6;
      border:1px solid #eee0c8;
      border-radius:14px;
      padding:10px 12px;
      font-size:14px;
      color:#455a64;
      font-weight:900;
    }
    .seat-legend{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin:10px 0 14px;
      font-size:12px;
      font-weight:900;
      color:#60747d;
    }
    .seat-legend span{
      display:inline-flex;
      align-items:center;
      gap:5px;
      background:#f8f2e6;
      padding:6px 9px;
      border-radius:999px;
      border:1px solid #eee0c8;
    }
    .dot-seat{
      width:10px;height:10px;border-radius:50%;display:inline-block;
    }
    .dot-free{background:#dcefd3;border:1px solid #77a86f}
    .dot-selected{background:#d8bd74;border:1px solid #9b7b27}
    .dot-disabled{background:#eceff1;border:1px solid #b0bec5}
    .dot-warn{background:#ffe0b2;border:1px solid #fb8c00}
    .seat-map{
      display:grid;
      grid-template-columns:repeat(4,minmax(150px,1fr));
      gap:14px;
    }
    .seat-zone{
      background:#f8f2e6;
      border:1px solid #eee0c8;
      border-radius:18px;
      padding:14px;
    }
    .seat-zone h4{
      margin:0 0 10px;
      font-size:15px;
      font-weight:900;
      color:#18252d;
    }
    .seat-buttons{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:8px;
    }
    .seat-zone.compact .seat-buttons{grid-template-columns:repeat(3,1fr)}
    .seat-btn{
      border:1px solid #ded2bd;
      background:#fffdf8;
      color:#18252d;
      border-radius:13px;
      padding:10px 8px;
      cursor:pointer;
      font-weight:900;
      font-size:13px;
      line-height:1.2;
      transition:.15s ease;
    }
    .seat-btn small{
      display:block;
      margin-top:3px;
      font-size:11px;
      color:#78909c;
      font-weight:900;
    }
    .seat-btn:hover:not(.disabled){
      transform:translateY(-1px);
      box-shadow:0 6px 14px rgba(0,0,0,.08);
      border-color:#d8bd74;
    }
    .seat-btn.selected{
      background:#d8bd74;
      color:#111;
      border-color:#b99b4c;
      box-shadow:0 8px 18px rgba(216,189,116,.28);
    }
    .seat-btn.selected small{color:#3b2e10}
    .seat-btn.unselected-small{
      background:#f5f7f8;
      color:#60747d;
    }
    .seat-total-ok{
      background:#dcefd3 !important;
      color:#2e7d32 !important;
      border-color:#9ccc9c !important;
    }
    .seat-total-warn{
      background:#fff1c6 !important;
      color:#8a5a00 !important;
      border-color:#f0c45f !important;
    }
    .seat-note{
      margin-top:12px;
      font-size:12px;
      font-weight:900;
      color:#78909c;
      line-height:1.5;
    }
    @media(max-width:1100px){
      .seat-map{grid-template-columns:repeat(2,1fr)}
    }
    @media(max-width:720px){
      .seat-map{grid-template-columns:1fr}
    }
    .crm-main{
    display:grid;
     grid-template-columns:420px 1fr;
    gap:20px;
    margin-top:20px;
}

.crm-list{
    min-height:650px;
}

.crm-detail{
    min-height:650px;
}

@media(max-width:1100px){

    .crm-main{
        grid-template-columns:1fr;
    }

}
.crm-customer-item{
    padding:14px;
    border-bottom:1px solid #e8e8e8;
    cursor:pointer;
    transition:.2s;
}

.crm-customer-item:hover{
    background:#f8f4ea;
}
.crm-history-item{
    padding:12px;

    border:1px solid #ececec;

}
.crm-history-card{
    background:#fff;
    border:1px solid #e8e8e8;

}

.crm-history-top{
    display:flex;
    justify-content:space-between;

}

.crm-history-date{
    font-size:18px;

}

.crm-history-body{

}

.badge-green{
    background:#d8f5df;

}

.badge-blue{

}

    background:#333;

.crm-tag{

.crm-tag.vip{

}

.crm-summary-card{
    background:#fff;
    border:1px solid #e5e5e5;

     padding:16px 18px;

}

.crm-summary-header{
    display:flex;

    align-items:center;

}

.crm-phone{
    color:#666;

}

.crm-tag-big{

}

.crm-summary-grid{
    display:grid;

}

.crm-summary-grid div{
    background:#fafafa;

}

.crm-summary-grid span{
    display:block;
    color:#888;

}

.crm-summary-grid strong{

}
.crm-memo{

    width:100%;

    min-height:120px;

    padding:18px;

    border:1px solid #ddd;

    resize:vertical;

    background:#fffefc;

    box-sizing:border-box;

}

.crm-memo:focus{

    outline:none;

    border-color:#c8a246;

    box-shadow:0 0 0 3px rgba(200,162,70,.15);

}

.crm-memo-btn{

    min-width:150px;

}
.bulk-template-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:15px;
}

.bulk-template-buttons button{
    min-width:120px;
}

.calendar-toolbar{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.calendar-toolbar h3{
  min-width:180px;
  text-align:center;
  font-size:24px;
  font-weight:900;
}

.calendar-summary{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:16px;
}

.calendar-summary .summary-pill{
  background:#f8f2e6;
  border:1px solid #eee0c8;
  border-radius:999px;
  padding:9px 13px;
  font-size:13px;
  font-weight:900;
  color:#455a64;
}

.calendar-table{
  width:100%;
  border-collapse:separate;
  border-spacing:6px;
  table-layout:fixed;
}

.calendar-table th{
  padding:4px 0;
  font-size:15px;
  font-weight:900;
  color:#455a64;
  text-align:center;
}

.calendar-table td{
  min-height:190px;
  vertical-align:top;
  background:#fffaf0;
  border:1px solid #eadfc9;
  border-radius:18px;
  padding:10px;
  cursor:pointer;
}

.calendar-table td:hover{
  background:#fff1c6;
}

.calendar-table td.today{
  border:3px solid #c79d2d;
  background:#fff7d8;
  box-shadow:0 0 0 3px rgba(215,189,116,.18);
}

.calendar-table td.empty{
  background:transparent;
  border:0;
  cursor:default;
}

.cal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}

.cal-day{
  font-size:18px;
  font-weight:900;
  color:#18252d;
}

.cal-count{
  background:#241f17;
  color:#f1d891;
  padding:5px 9px;
  border-radius:999px;
  font-size:12px;
  font-weight:900;
}

.cal-list{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.cal-item{
  border-radius:10px;
  padding:7px 8px;
  font-size:12px;
  line-height:1.45;
  font-weight:900;
  margin-bottom:5px;
}

.cal-item.confirm{
  background:#e8f5e9;
  border-left-color:#2e7d32;
}

.cal-item.wait{
  background:#fff8e1;
  border-left-color:#f59e0b;
}

.cal-item.cancel{
  background:#eeeeee;
  border-left-color:#9e9e9e;
  color:#777;
  text-decoration:line-through;
}

.cal-item.noshow{
  background:#fee2e2;
  border-left-color:#dc2626;
}

.cal-more{
  margin-top:4px;
  font-size:12px;
  font-weight:900;
  color:#8a5a00;
}

.cal-empty{
  color:#b0a28d;
  font-size:12px;
  font-weight:900;
  padding-top:8px;
}

@media(max-width:900px){
  .calendar-table{
    min-width:900px;
  }

  #calendarArea{
    overflow-x:auto;
  }
}
.calendar-toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
    gap:20px;
}

.calendar-left,
.calendar-right{
    width:180px;
}

.calendar-center{
    display:flex;
    align-items:center;
    gap:18px;
}

.calendar-center h3{
    margin:0;
    min-width:190px;
    text-align:center;
    font-size:28px;
    font-weight:900;
}
.calendar-day-card{

    border:1px solid #ece2cf;

    border-radius:16px;

    padding:14px;

    margin-bottom:12px;

    background:#fffdf8;

}

.calendar-day-top{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:10px;

}

.calendar-day-name{

    font-size:18px;

    font-weight:900;

}

.calendar-day-info{

    color:#60747d;

    line-height:1.8;

    font-size:14px;

    font-weight:800;

}
.calendar-toolbar{
  margin-bottom:22px;
}

.calendar-toolbar h3{
  margin:0 0 16px;
  text-align:center;
  font-size:24px;
  font-weight:900;
}

.calendar-nav{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:14px;
}

.calendar-nav button:first-child{
  justify-self:start;
}

.calendar-nav button:nth-child(2){
  justify-self:center;
}

.calendar-nav button:last-child{
  justify-self:end;
}

@media(max-width:720px){
  .calendar-nav{
    grid-template-columns:repeat(3,auto);
    justify-content:space-between;
    gap:8px;
  }

  .calendar-nav .btn{
    padding:12px 14px;
    font-size:14px;
